name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10

  lighthouse:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/onboarding
            http://localhost:3000/dashboard
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  accessibility:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          npm run start &
          sleep 5
      - name: Install matching Chrome + ChromeDriver
        run: |
          npx browser-driver-manager install chrome
          set -a
          source "$HOME/.browser-driver-manager/.env"
          set +a
          echo "CHROMEDRIVER_TEST_PATH=$HOME/$CHROMEDRIVER_TEST_PATH" >> "$GITHUB_ENV"
          echo "GOOGLE_CHROME_SHIM=$HOME/$CHROME_TEST_PATH" >> "$GITHUB_ENV"
      - name: Run axe accessibility tests
        run: npx @axe-core/cli http://localhost:3000 --exit --chromedriver-path "$CHROMEDRIVER_TEST_PATH"
      - name: Run axe on onboarding
        run: npx @axe-core/cli http://localhost:3000/onboarding --exit --chromedriver-path "$CHROMEDRIVER_TEST_PATH"
      - name: Run axe on dashboard
        run: npx @axe-core/cli http://localhost:3000/dashboard --exit --chromedriver-path "$CHROMEDRIVER_TEST_PATH"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7
